<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Bag – VASTAAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="account-page">

<header class="header header-simple">
  <div class="header-main">
    <a href="index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text-wrap">
        <div class="logo-name">VASTAAR</div>
        <div class="logo-tagline">Shopping Bag</div>
      </div>
    </a>
    <a href="index.html" class="back-home"><i class="fa fa-arrow-left"></i> Continue Shopping</a>
  </div>
</header>

<main class="cart-page">
  <div class="account-head">
    <h1><i class="fa fa-shopping-bag"></i> Your Bag</h1>
    <p id="cartSub">Loading…</p>
  </div>

  <div id="cartEmpty" class="settings-section hidden">
    <p>Your bag is empty.</p>
    <a href="index.html" class="btn-auth" style="width:auto;display:inline-flex;">Shop Now</a>
  </div>

  <div id="cartList" class="cart-list"></div>

  <div id="cartSummary" class="cart-summary hidden">
    <div class="cart-total-row">
      <span>Items</span>
      <strong id="cartItemCount">0</strong>
    </div>
    <div class="cart-total-row">
      <span>Estimated total</span>
      <strong id="cartTotal">Rs. 0</strong>
    </div>
    <button type="button" class="btn-auth" id="checkoutBtn">Proceed to Checkout</button>
    <p class="form-hint" style="margin-top:12px;text-align:center;">
      <a href="login.html" class="link-crimson">Log in</a> to save your bag in MongoDB permanently.
    </p>
  </div>
</main>

<div class="toast" id="toast"><i class="fa fa-check-circle"></i> <span id="toastMsg"></span></div>

<script src="auth.js"></script>
<script>
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function renderCart() {
    await loadCurrentUser();
    const items = await getCartItems();
    const list = document.getElementById('cartList');
    const empty = document.getElementById('cartEmpty');
    const summary = document.getElementById('cartSummary');
    const sub = document.getElementById('cartSub');

    const count = items.reduce((s, i) => s + (i.qty || 1), 0);
    const total = items.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);

    if (count === 0) {
      empty.classList.remove('hidden');
      summary.classList.add('hidden');
      list.innerHTML = '';
      sub.textContent = 'No items yet — add from the shop.';
      return;
    }

    empty.classList.add('hidden');
    summary.classList.remove('hidden');
    sub.textContent = isLoggedIn()
      ? `${count} item(s) saved in your MongoDB cart`
      : `${count} item(s) in this browser session (log in to save forever)`;

    document.getElementById('cartItemCount').textContent = count;
    document.getElementById('cartTotal').textContent = `Rs. ${total.toLocaleString()}`;

    list.innerHTML = items.map((item) => `
      <div class="cart-line" data-key="${escapeHtml(item.key)}">
        <div class="cart-line-media">
          ${item.imageUrl && hasValidImage(item.imageUrl)
            ? `<img src="${item.imageUrl}" alt="" />`
            : `<span class="cart-line-emoji">${item.emoji || '👗'}</span>`}
        </div>
        <div class="cart-line-info">
          <div class="cart-line-brand">${escapeHtml(item.brand || 'VASTAAR')}</div>
          <div class="cart-line-name">${escapeHtml(item.name)}</div>
          <div class="cart-line-price">${item.priceLabel || `Rs. ${(item.price || 0).toLocaleString()}`} × ${item.qty || 1}</div>
        </div>
        <button type="button" class="cart-remove" data-remove="${escapeHtml(item.key)}" aria-label="Remove">
          <i class="fa fa-trash"></i>
        </button>
      </div>
    `).join('');

    list.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await removeFromCart(btn.dataset.remove);
        await renderCart();
        showAuthToast('Item removed');
      });
    });
  }

  document.getElementById('checkoutBtn').addEventListener('click', () => {
    showAuthToast('Checkout coming soon — thank you for shopping VASTAAR!');
  });

  renderCart();
</script>
</body>
</html>
