<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – VASTRAA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

<header class="header header-simple">
  <div class="header-main">
    <a href="index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text-wrap">
        <div class="logo-name">VASTRAA</div>
        <div class="logo-tagline">Nepal's Fashion</div>
      </div>
    </a>
    <a href="index.html" class="back-home"><i class="fa fa-arrow-left"></i> Back to Shop</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-head">
      <h1 class="auth-title">Welcome to <span>VASTRAA</span></h1>
      <p class="auth-sub">Sign in to track orders, save wishlists &amp; more</p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Login</button>
      <button type="button" class="auth-tab" data-tab="signup">Create Account</button>
    </div>

    <!-- LOGIN -->
    <form class="auth-form active" id="loginForm" data-panel="login">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-icon-wrap">
          <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password" />
          <button type="button" class="toggle-pw" data-target="loginPassword" aria-label="Show password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Login <i class="fa fa-arrow-right"></i></button>
    </form>

    <!-- SIGN UP -->
    <form class="auth-form" id="signupForm" data-panel="signup">
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="signupPhone">Phone</label>
        <input type="tel" id="signupPhone" placeholder="+977 98XXXXXXXX" autocomplete="tel" />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <div class="input-icon-wrap">
          <input type="password" id="signupPassword" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="signupPassword" aria-label="Show password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Create Account <i class="fa fa-user-plus"></i></button>
    </form>

    <p class="auth-foot">By continuing you agree to VASTRAA's Terms of Use &amp; Privacy Policy.</p>
  </div>
</main>

<div class="toast" id="toast"><i class="fa fa-check-circle"></i> <span id="toastMsg"></span></div>

<script src="auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const nextPage = params.get('next') || 'profile.html';

  (async () => {
    const online = await checkApiHealth();
    if (!online) {
      showAuthToast('Start the server: cd backend && npm start', true);
    }
    await loadCurrentUser();
    if (isLoggedIn()) {
      window.location.href = nextPage;
      return;
    }
  })();

  document.querySelectorAll('.auth-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      document.querySelectorAll('.auth-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.auth-form').forEach((f) => f.classList.toggle('active', f.dataset.panel === name));
    });
  });

  document.querySelectorAll('.toggle-pw').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.querySelector('i').className = isPw ? 'fa fa-eye-slash' : 'fa fa-eye';
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const result = await login(email, password);
    if (result.ok) {
      showAuthToast('Welcome back! Redirecting…');
      setTimeout(() => { window.location.href = nextPage; }, 600);
    } else {
      showAuthToast(result.message, true);
    }
  });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const result = await register({
        name: document.getElementById('signupName').value.trim(),
        email: document.getElementById('signupEmail').value.trim(),
        phone: document.getElementById('signupPhone').value.trim(),
        password: document.getElementById('signupPassword').value,
      });
      if (result.ok) {
        showAuthToast('Account created! Welcome to VASTRAA.');
        setTimeout(() => { window.location.href = nextPage; }, 700);
      }
    } catch (err) {
      showAuthToast(err.message, true);
    }
  });
</script>
</body>
</html>
